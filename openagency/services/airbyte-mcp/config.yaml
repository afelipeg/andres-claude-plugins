connectors:
  - package: airbyte-agent-google-ads
    credentials:
      client_id: ${env.GOOGLE_ADS_CLIENT_ID}
      client_secret: ${env.GOOGLE_ADS_CLIENT_SECRET}
      refresh_token: ${env.GOOGLE_ADS_REFRESH_TOKEN}
      developer_token: ${env.GOOGLE_ADS_DEVELOPER_TOKEN}
  - package: airbyte-agent-facebook-marketing
    credentials:
      access_token: ${env.META_ACCESS_TOKEN}
      app_id: ${env.META_APP_ID}
      app_secret: ${env.META_APP_SECRET}
  - package: airbyte-agent-tiktok-marketing
    credentials:
      access_token: ${env.TIKTOK_ACCESS_TOKEN}
  - package: airbyte-agent-amazon-ads
    credentials:
      client_id: ${env.AMAZON_ADS_CLIENT_ID}
      client_secret: ${env.AMAZON_ADS_CLIENT_SECRET}
      refresh_token: ${env.AMAZON_ADS_REFRESH_TOKEN}
  - package: airbyte-agent-linkedin-ads
    credentials:
      access_token: ${env.LINKEDIN_ACCESS_TOKEN}
  - package: airbyte-agent-snapchat-marketing
    credentials:
      access_token: ${env.SNAPCHAT_ACCESS_TOKEN}
  - package: airbyte-agent-pinterest
    credentials:
      access_token: ${env.PINTEREST_ACCESS_TOKEN}
